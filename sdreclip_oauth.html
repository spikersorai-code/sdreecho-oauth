<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SdreClip — TikTok yetkilendirme</title>
<style>
:root{color-scheme:light dark;--accent:#fe2c55;--card:#fff;--text:#202124;--muted:#5f6368;--bg:#f6f7f9}
@media(prefers-color-scheme:dark){:root{--card:#171717;--text:#f1f3f4;--muted:#bdc1c6;--bg:#0f0f0f}}
*{box-sizing:border-box}body{margin:0;font:16px/1.7 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:720px;margin:48px auto;padding:0 20px}.card{background:var(--card);border-radius:18px;padding:38px;box-shadow:0 8px 28px #0001}
h1{margin-top:0;font-size:1.5rem}.muted{color:var(--muted)}
code{display:block;word-break:break-all;background:#0001;padding:14px;border-radius:10px;margin:14px 0;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:15px;cursor:pointer}
</style>
<main><div class="card">
<h1>TikTok yetkilendirme</h1>
<div id="govde"><p class="muted">Kod okunuyor…</p></div>
</div></main>
<script>
// TikTok, izin ekranindan sonra buraya ?code=...&state=... ile doner.
// Sayfa statik oldugu icin kodu yalnizca gosterir; token takasini
// sunucudaki script yapar. Kod tek kullanimlik ve kisa omurludur.
(function () {
  var s = new URLSearchParams(location.search);
  var kod = s.get("code"), hata = s.get("error"), g = document.getElementById("govde");
  if (hata) {
    g.innerHTML = '<p><b>Yetkilendirme iptal edildi.</b></p><p class="muted">' +
      (s.get("error_description") || hata) + "</p>";
    return;
  }
  if (!kod) {
    g.innerHTML = '<p>Bu sayfa TikTok yetkilendirmesinin donus adresidir.</p>' +
      '<p class="muted">Dogrudan acildiginda gosterecek bir sey yok.</p>';
    return;
  }
  g.innerHTML = "<p>Kod alindi. Asagidakini kopyala:</p><code id=k></code>" +
    "<button id=b>Kopyala</button>";
  document.getElementById("k").textContent = kod;
  document.getElementById("b").onclick = function () {
    navigator.clipboard.writeText(kod).then(function () {
      document.getElementById("b").textContent = "Kopyalandi";
    });
  };
})();
</script>
